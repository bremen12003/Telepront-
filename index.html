  var bar=css(document.createElement('div'),{display:'flex',gap:'8px',padding:'12px 14px 14px'});
  function btn(txt,bg,fg){var b=css(document.createElement('button'),{flex:'1',height:'46px',borderRadius:'12px',border:'0',background:bg,color:fg,fontWeight:'800',fontSize:'13px',letterSpacing:'.05em'});b.textContent=txt;return b}
  var cancel=btn('CANCELAR','#2a2a2a','#ddd'),ok=btn('IMPORTAR','#22C55E','#000');
  cancel.onclick=function(){ov.remove()};
  ok.onclick=function(){
    var cur=(window.__tpApi&&window.__tpApi.songs)||[],out=cur.slice(),nuevas=[],added=0,over=0,ts=Date.now(),seq=0;
    info.forEach(function(it){
      if(it.policy==='skip')return;
      it.g.list.forEach(function(item){
        var idx=-1;
        for(var i=0;i<out.length;i++){if(norm(out[i].folder)===it.k&&norm(out[i].title)===norm(item.title)){idx=i;break}}
        if(idx>=0){
          if(it.policy==='over'){var s=Object.assign({},out[idx],{lyrics:item.lyrics});delete s.lt;out[idx]=s;over++}
        }else{
          nuevas.push({id:ts+'-'+(seq++),title:item.title,artist:it.fname,folder:it.fname,lyrics:item.lyrics,cover:''});added++;
        }
      });
    });
    var all=nuevas.concat(out);var tosave=nuevas.slice();out.forEach(function(s,i){if(s!==cur[i])tosave.push(s)});
    window.__tpApi.setSongs(all);
    window.__tpApi.setFolders(function(prev){
      var cnt={};all.forEach(function(s){var k=s.folder||'General';cnt[k]=(cnt[k]||0)+1});
      var res=prev.map(function(f){return Object.assign({},f,{count:cnt[f.name]!==undefined?cnt[f.name]:f.count})});
      Object.keys(cnt).forEach(function(k){if(!res.some(function(f){return f.name===k}))res.push({name:k,count:cnt[k]})});
      return res.sort(function(a,b){return a.name.localeCompare(b.name)});
    });
    if(window.__tpFS&&window.__tpFS.on)tosave.forEach(function(s){window.__tpFS.saveSong(s)});
    ov.remove();
    toast('Importé '+added+' nuevas'+(over?' • '+over+' sobrescritas':''));
  };
  bar.appendChild(cancel);bar.appendChild(ok);
  box.appendChild(h);box.appendChild(sub);box.appendChild(list);box.appendChild(bar);
  ov.appendChild(box);document.body.appendChild(ov);
  toast('');
};
})();
</script>
<script>(function(){
var DIR='EXTERNAL_STORAGE',ROOT='Download/Letras',META=ROOT+'/_telepronter.json';
var FS={on:false,speeds:{},_q:Promise.resolve(),_tm:0};
window.__tpFS=FS;
function plug(){try{var C=window.Capacitor;if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.Filesystem)return C.Plugins.Filesystem}catch(e){}return null}
function api(){return window.__tpApi}
function toast(m){var a=api();if(a&&a.toast)a.toast(m)}
function safe(x){return (x||'').replace(/[\\\/:*?"<>|]/g,'').replace(/\s+/g,' ').trim().slice(0,80)||'sin nombre'}
function norm(x){return (x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function css(el,o){for(var k in o)el.style[k]=o[k];return el}
function b64bytes(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function mmss(t){var m=Math.floor(t/60),s=t-m*60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s.toFixed(2)}
function fmtDur(sec){if(!sec||sec<=0)return '--:--';var m=Math.floor(sec/60),s=Math.round(sec%60);if(s===60){m++;s=0}return m+':'+(s<10?'0':'')+s}
function parseDur(x){var m=(x||'').match(/(\d+):(\d+)/);return m?parseInt(m[1],10)*60+parseInt(m[2],10):0}
function skey(s){return norm(s.folder)+'/'+norm(s.title)}

function build(song){
  var L=song.lyrics||'';
  var t='Título: '+song.title+'\nArtista: '+(song.artist||song.folder||'')+'\nDuración: '+fmtDur(song.dur)+'\nFuente: Telepronter\n\n'+L.replace(/\s+$/,'')+'\n';
  if(song.lt){
    var ls=L.split('\n'),out=[];
    song.lt.forEach(function(v,i){if(typeof v==='number'&&ls[i]!==undefined)out.push('['+mmss(v)+'] '+ls[i].trim())});
    if(out.length)t+='\n\n--- TELEPROMPTER SYNC (hidden timestamps) ---\n'+out.join('\n')+'\n--- END SYNC ---\n';
  }
  return t;
}
function parseTxt(txt){
  var res={title:'',artist:'',dur:0,lyrics:'',lt:null};
  txt=(txt||'').replace(/^﻿/,'').replace(/\r\n?/g,'\n');
  var si=txt.indexOf('--- TELEPROMPTER SYNC'),sync='',main=txt;
  if(si>=0){main=txt.slice(0,si);sync=txt.slice(si)}
  var lines=main.split('\n'),i=0,hdr=false;
  while(i<lines.length){
    var m=lines[i].match(/^(T[ií]tulo|Artista|Duraci[oó]n|Fuente):\s*(.*)$/i);
    if(!m)break;hdr=true;var k=m[1].toLowerCase();
    if(k.charAt(0)==='t')res.title=m[2].trim();else if(k==='artista')res.artist=m[2].trim();else if(k.charAt(0)==='d')res.dur=parseDur(m[2]);
    i++;
  }
  if(hdr){while(i<lines.length&&lines[i].trim()==='')i++}else i=0;
  res.lyrics=lines.slice(i).join('\n').replace(/\s+$/,'');
  if(sync&&/hidden timestamps/i.test(sync.split('\n')[0])){
    var times=[];
    sync.split('\n').forEach(function(l){var m=l.match(/^\[(\d+):(\d+(?:\.\d+)?)\]/);if(m)times.push(parseInt(m[1],10)*60+parseFloat(m[2]))});
    var pls=res.lyrics.split('\n'),nz=[];
    pls.forEach(function(x,j){if(x.trim()!=='')nz.push(j)});
    if(times.length&&times.length===nz.length){var lt=new Array(pls.length).fill(null);nz.forEach(function(j,q){lt[j]=times[q]});res.lt=lt}
  }
  return res;
}
FS.parseTxt=parseTxt;FS.build=build;

async function ls(path){
  var P=plug(),r=await P.readdir({path:path,directory:DIR}),f=(r&&r.files)||r||[];
  return f.map(function(x){
    if(typeof x==='string')return {name:x,type:/\.[a-z0-9]{2,5}$/i.test(x)?'file':'directory'};
    return x;
  });
}
async function readMeta(){
  var P=plug();
  try{var r=await P.readFile({path:META,directory:DIR,encoding:'utf8'});var o=JSON.parse(r.data);FS.speeds=(o&&o.speeds)||{}}catch(e){FS.speeds={}}
}
FS.setSpeed=function(song,v){
  if(!FS.on)return;
  FS.speeds[skey(song)]=v;
  clearTimeout(FS._tm);
  FS._tm=setTimeout(function(){
    FS._q=FS._q.then(function(){var P=plug();return P.writeFile({path:META,directory:DIR,data:JSON.stringify({v:1,speeds:FS.speeds}),encoding:'utf8',recursive:true})}).catch(function(){});
  },800);
};

FS.scan=async function(){
  var P=plug();if(!P||!FS.on)return 0;
  await readMeta();
  var map={},jobs=[];
  function add(dirName,e){
    var nm=e.name||'',m=nm.match(/\.(txt|docx)$/i);
    if(!m||nm.charAt(0)==='.'||nm.indexOf('~$')===0)return;
    var ext=m[1].toLowerCase(),base=nm.replace(/\.(txt|docx)$/i,''),path=ROOT+(dirName?'/'+dirName:'')+'/'+nm;
    jobs.push((async function(){
      var s={id:'fs:'+path,title:base,artist:dirName||'',folder:dirName||'',lyrics:'',cover:'',src:'fs',path:path,dir:dirName||''};
      if(ext==='txt'){
        var r;try{r=await P.readFile({path:path,directory:DIR,encoding:'utf8'})}catch(err){return}
        var p=parseTxt(typeof r.data==='string'?r.data:'');
        s.title=p.title||base;s.artist=p.artist||dirName||'General';s.folder=dirName||p.artist||'General';
        s.lyrics=p.lyrics;if(p.dur)s.dur=p.dur;if(p.lt)s.lt=p.lt;
        if(!s.lyrics)return;
      }else{s.artist=dirName||'General';s.folder=dirName||'General';s.docx=1}
      var sp=FS.speeds[skey(s)];if(sp)s.speed=sp;
      var k=skey(s),prev=map[k];
      if(!prev||(prev.docx&&!s.docx))map[k]=s;
    })());
  }
  var root=await ls(ROOT);
  for(var i=0;i<root.length;i++){
    var e=root[i],nm=e.name||'';
    if(e.type==='directory'){
      if(nm.charAt(0)==='.'||nm.charAt(0)==='_')continue;
      var sub=[];try{sub=await ls(ROOT+'/'+nm)}catch(err){}
      sub.forEach(function(x){if(x.type!=='directory')add(nm,x)});
    }else add('',e);
  }
  for(var j=0;j<jobs.length;j+=8)await Promise.all(jobs.slice(j,j+8));
  var scanned=Object.keys(map).map(function(k){return map[k]});
  var a=api();if(!a)return scanned.length;
  var legacy=(a.songs||[]).filter(function(x){return x.src!=='fs'});
  var all=scanned.concat(legacy);
  a.setSongs(all);
  a.setFolders(function(prev){
    var cnt={};all.forEach(function(s){var k=s.folder||'General';cnt[k]=(cnt[k]||0)+1});
    var res=Object.keys(cnt).map(function(k){var old=prev.find(function(f){return f.name===k});return Object.assign({},old||{},{name:k,count:cnt[k]})});
    return res.sort(function(x,y){return x.name.localeCompare(y.name)});
  });
  return scanned.length;
};

FS.load=async function(song){
  var P=plug();if(!P||!song.path)return '';
  try{
    var r=await P.readFile({path:song.path,directory:DIR});
    var d=r.data;if(typeof d!=='string')return '';
    var bytes=b64bytes(d);
    return window.__tpDocx?await window.__tpDocx(bytes):'';
  }catch(e){toast('No pude leer el archivo');return ''}
};

FS.saveSong=function(song){
  if(!FS.on)return Promise.resolve(false);
  FS._q=FS._q.then(async function(){
    try{
      var P=plug(),dir=safe(song.folder||song.artist||'General'),path=ROOT+'/'+dir+'/'+safe(song.title)+'.txt';
      await P.writeFile({path:path,directory:DIR,data:build(song),encoding:'utf8',recursive:true});
      var a=api();
      if(a)a.setSongs(function(es){
        var out=[];es.forEach(function(x){
          if(x.id===song.id)out.push(Object.assign({},x,{src:'fs',path:path,dir:dir,docx:undefined}));
          else if(x.src==='fs'&&x.path===path){}
          else out.push(x);
        });return out;
      });
      if(song.speed)FS.setSpeed(song,song.speed);
      return true;
    }catch(e){toast('No pude guardar en Descargas/Letras');return false}
  });
  return FS._q;
};
FS.delSong=function(song){
  if(!FS.on||song.src!=='fs'||!song.path)return;
  FS._q=FS._q.then(function(){return plug().deleteFile({path:song.path,directory:DIR})}).catch(function(){});
};
FS.delFolder=function(songs){
  if(!FS.on)return;
  var dirs={};
  songs.forEach(function(s){if(s.src==='fs'&&s.path){FS.delSong(s);dirs[s.path.replace(/\/[^\/]*$/,'')]=1}});
  Object.keys(dirs).forEach(function(d){if(d!==ROOT)FS._q=FS._q.then(function(){return plug().rmdir({path:d,directory:DIR,recursive:false})}).catch(function(){})});
};

FS.ensure=async function(){
  var P=plug();
  try{await P.readdir({path:ROOT,directory:DIR});return 'ok'}catch(e){
    var msg=((e&&e.message)||'')+' '+((e&&e.code)||'');
    if(/unimplemented|not implemented/i.test(msg))return 'none';
    try{await P.mkdir({path:ROOT,directory:DIR,recursive:true});return 'ok'}catch(e2){
      var m2=((e2&&e2.message)||'')+' '+((e2&&e2.code)||'');
      if(/unimplemented|not implemented/i.test(m2))return 'none';
      return 'perm';
    }
  }
};

function modal(id,title,body,buttons){
  var old=document.getElementById(id);if(old)old.remove();
  var ov=css(document.createElement('div'),{position:'fixed',inset:'0',zIndex:'300',background:'rgba(0,0,0,.82)',display:'flex',alignItems:'center',justifyContent:'center',padding:'16px'});ov.id=id;
  var box=css(document.createElement('div'),{width:'100%',maxWidth:'420px',background:'#141414',border:'1px solid #333',borderRadius:'18px',color:'#fff',padding:'18px',fontFamily:'Inter,system-ui,sans-serif',boxShadow:'0 20px 60px #000'});
  var h=css(document.createElement('div'),{fontWeight:'800',fontSize:'16px',marginBottom:'8px'});h.textContent=title;
  var b=css(document.createElement('div'),{fontSize:'13px',color:'#bbb',lineHeight:'1.5',whiteSpace:'pre-line',marginBottom:'14px'});b.textContent=body;
  var bar=css(document.createElement('div'),{display:'flex',gap:'8px'});
  buttons.forEach(function(x){var bt=css(document.createElement('button'),{flex:'1',height:'44px',borderRadius:'12px',border:'0',background:x.bg,color:x.fg,fontWeight:'800',fontSize:'12px',letterSpacing:'.05em'});bt.textContent=x.t;bt.onclick=function(){ov.remove();x.f&&x.f()};bar.appendChild(bt)});
  box.appendChild(h);box.appendChild(b);box.appendChild(bar);ov.appendChild(box);document.body.appendChild(ov);
}
FS.askPerm=function(){
  modal('tp-permmodal','Falta un permiso',
    'Para guardar y leer tus letras en Descargas/Letras, la app necesita acceso a los archivos.\n\nAjustes › Apps › Telepronter › Permisos › Archivos (o "Permitir administrar todos los archivos") y actívalo.\n\nLuego regresa aquí y toca REINTENTAR.',
    [{t:'SIN CARPETA',bg:'#2a2a2a',fg:'#ddd'},{t:'REINTENTAR',bg:'#22C55E',fg:'#000',f:function(){FS.init()}}]);
};
FS.button=function(){
  if(document.getElementById('tp-fsref'))return;
  var b=css(document.createElement('button'),{position:'fixed',left:'12px',bottom:'84px',width:'48px',height:'48px',borderRadius:'50%',border:'1px solid #333',background:'#1b1b1b',color:'#fff',zIndex:'40',fontSize:'8px',fontWeight:'900',lineHeight:'1.1',letterSpacing:'.04em'});
  b.id='tp-fsref';b.innerHTML='<span style="font-size:18px;display:block">↻</span>CARPETA';
  b.onclick=async function(){toast('Escaneando Descargas/Letras…');try{var n=await FS.scan();toast(n+' letras en la carpeta')}catch(e){toast('No pude leer la carpeta')}};
  document.body.appendChild(b);
};
FS.migrate=function(){
  var a=api();if(!a)return;
  try{if(localStorage.getItem('tp_mig')==='no')return}catch(e){}
  var leg=(a.songs||[]).filter(function(x){return x.src!=='fs'&&!(/^[123]$/.test(String(x.id))&&x.lyrics&&x.lyrics.length<30)&&x.lyrics});
  if(!leg.length)return;
  modal('tp-migmodal','Pasar canciones a la carpeta',
    'Tienes '+leg.length+' canciones guardadas dentro de la app.\n¿Las paso a Descargas/Letras para que no se pierdan?\n(Las que ya existan en la carpeta no se tocan.)',
    [{t:'DEJAR',bg:'#2a2a2a',fg:'#ddd',f:function(){try{localStorage.setItem('tp_mig','no')}catch(e){}}},
     {t:'PASAR',bg:'#22C55E',fg:'#000',f:async function(){
        var have={};(a.songs||[]).forEach(function(x){if(x.src==='fs')have[skey(x)]=1});
        var n=0,skip=[];
        for(var i=0;i<leg.length;i++){
          if(have[skey(leg[i])]){skip.push(leg[i].id);continue}
          var ok=await FS.saveSong(leg[i]);if(ok)n++;
        }
        if(skip.length)api().setSongs(function(es){return es.filter(function(x){return skip.indexOf(x.id)<0})});
        toast('Pasé '+n+' canciones a Descargas/Letras');
     }}]);
};

FS.init=async function(){
  var P=plug();if(!P)return;
  try{if(P.requestPermissions)await P.requestPermissions()}catch(e){}
  var st=await FS.ensure();
  if(st==='none')return;
  if(st==='perm'){FS.askPerm();return}
  FS.on=true;
  try{var n=await FS.scan();toast(n+' letras de Descargas/Letras')}catch(e){toast('No pude leer Descargas/Letras')}
  FS.button();
  setTimeout(FS.migrate,1200);
};

// las canciones de la carpeta no se duplican en el almacenamiento de la app
try{
  var os=Storage.prototype.setItem;
  Storage.prototype.setItem=function(k,v){
    if(k==='vmg_songs'){try{v=JSON.stringify(JSON.parse(v).filter(function(x){return x&&x.src!=='fs'}))}catch(e){}}
    return os.call(this,k,v);
  };
}catch(e){}

document.addEventListener('visibilitychange',function(){if(!document.hidden&&document.getElementById('tp-permmodal')){var m=document.getElementById('tp-permmodal');m.remove();FS.init()}});

var tries=0,iv=setInterval(function(){
  if(window.__tpApi||++tries>60){clearInterval(iv);if(window.__tpApi)FS.init()}
},250);
})();
</script>
